site_name: Portfolio
site_url: https://MichalBorek1983.github.io/Portfolio/
site_author: Michał Borek
site_description: "Portfolio projektów Data Science i AI Michała Borka"
repo_url: https://github.com/MichalBorek1983/Portfolio
repo_name: MichalBorek1983/Portfolio

theme:
  name: material
  language: pl
  palette:
    - scheme: default
      primary: blue
      accent: blue
      
  features:
    - navigation.expand
    - navigation.sections
    - navigation.top

extra_css:
  - stylesheets/custom.css

markdown_extensions:
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - pymdownx.superfences

nav:
  - Strona Domowa: index.md
  - O mnie: about.md
  - Projekty:
      - "Wyróżnione":
          - "Combined Studio": Combined Studio/index.md
          - "Agenci SDLC": Agenci_SDLC/index.md
          - "AI Decision Helper": AI_Decision_Helper/index.md
          - "Market Opportunity Discovery": Market_Opportunity_Discovery/index.md
          - "Agent Platform": Agent_Platform/index.md
          - "Halfmarathon Predictor": Halfmarathon Predictor/index.md
          - "EMNDR Dashboard": EMNDR_Dashboard/index.md
      - "Analizy EDA":
          - "Iris": Iris/index.md
          - "Titanic": Titanic/index.md
      - "Archiwum": Archiwum/index.md
  - Kontakt: contact.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/MichalBorek1983
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/micha%C5%82-borek-157258394/